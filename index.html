<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苹果芯片｜论坛主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", system-ui, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #10141c, #1f2937);
            color: #f3f4f6;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 48px;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 12px;
            color: #ffffff;
        }
        .subtitle {
            font-size: 17px;
            color: #9ca3af;
        }
        .card-wrap {
            display: grid;
            gap: 20px;
        }
        .card {
            background: rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 28px;
            border: 1px solid rgba(255,255,255,0.12);
            transition: all 0.25s ease;
        }
        .card:hover {
            background: rgba(255,255,255,0.12);
            transform: translateY(-3px);
        }
        .card h2 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #e5e7eb;
        }
        .card p {
            color: #9ca3af;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            padding: 10px 22px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #1d4ed8;
        }
        footer {
            margin-top: 60px;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
        }
        footer a {
            color: #60a5fa;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>苹果芯片资料库</h1>
            <p class="subtitle">A/M/S/S5L系列芯片科普项目 · 论坛主页</p>
        </header>

        <div class="card-wrap">
            <div class="card">
                <h2>📖 芯片百科</h2>
                <p>完整苹果芯片科普页面，包含三星S5L、A全系列（A19/A19Pro独立卡片）、M系列、S手表芯片，点击展开查看详细参数。</p>
                <a class="btn" href="https://qmqingmeng.github.io/Apple/chip">进入芯片百科</a>
            </div>

            <div class="card">
                <h2>🧪 测试页面</h2>
                <p>用于调试、新增芯片卡片、样式预览，开发测试专用页面。</p>
                <a class="btn" href="https://qmqingmeng.github.io/Apple/chiptest">进入测试页面</a>
            </div>
        </div>

        <footer>
            <p>项目地址：<a href="https://github.com/qmqingmeng/Apple">github.com/qmqingmeng/Apple</a></p>
            <p>备用直达链接：
                <br>
                <a href="https://qmqingmeng.github.io/Apple/chip">芯片百科</a> |
                <a href="https://qmqingmeng.github.io/Apple/chiptest">测试页</a>
            </p>
        </footer>
    </div>
</body>
</html>
